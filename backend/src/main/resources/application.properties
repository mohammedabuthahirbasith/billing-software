spring.application.name=billing


# --- Database connection ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/billing_app}
server.port=${PORT:8080}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
# Statement logging is a dev-only aid (see application-dev.properties) — in production it writes
# every query, including customer data bound into it, to the application log.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT — deliberately no fallback value: a default committed here is a publicly known signing key,
# and anyone holding it can mint a token for any store. Startup fails fast without JWT_SECRET
# (JwtService also enforces a 32-byte minimum). Run locally with -Dspring.profiles.active=dev.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Proxy headers ---
# Set to "framework" only where a trusted proxy strips and re-sets X-Forwarded-* (e.g. Render), so
# getRemoteAddr() resolves to the real client for AuthRateLimitFilter. Left at "none" the header is
# ignored entirely, which is the safe default: honouring a client-supplied one lets a caller rotate
# it per request and bypass rate limiting completely.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# --- Error responses ---
# Boot 4 renamed these from server.error.* to spring.web.error.* (old keys are deprecated
# and were being forced to ALWAYS by devtools' dev-property defaults, silently leaking stack
# traces). Set explicitly under the current namespace: never leak traces, but surface our own
# business messages and field-level validation errors to API clients.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always