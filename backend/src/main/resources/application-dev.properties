# Local development profile: activate with -Dspring.profiles.active=dev (or SPRING_PROFILES_ACTIVE=dev).
# The signing key below is intentionally a throwaway — it only ever applies to a local run, so no
# deployed environment can silently fall back to a key that is published in this repository.
app.jwt.secret=dev-only-secret-change-in-production-0123456789

spring.jpa.show-sql=true
